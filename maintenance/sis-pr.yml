name: SIS isolated PR verification
run-name: SIS verification (${{ github.event_name }}) - ${{ github.ref_name }}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      check:
        description: Verification scope
        type: choice
        options:
          - full
          - backend-startup
          - visual-baseline
        default: full
      startup_network:
        description: Startup control network mode (no website input)
        type: choice
        options:
          - bridge
          - internal
          - transition
        default: bridge

permissions:
  contents: read

concurrency:
  group: sis-pr-${{ github.event.pull_request.number || github.ref }}-${{ inputs.check || 'full' }}-${{ inputs.startup_network || 'bridge' }}
  cancel-in-progress: true

jobs:
  backend-startup:
    if: github.event_name == 'workflow_dispatch' && inputs.check == 'backend-startup'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/guardian
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install trusted HTTP client
        run: python -m pip install httpx==0.28.1
      - name: Install reviewed backend CLI
        run: python .github/guardian/install-backend-cli.py --directory "$RUNNER_TEMP/guardian-cli"
      - name: Start trusted backend and execute real database query
        env:
          STARTUP_NETWORK_MODE: ${{ inputs.startup_network }}
        run: python .github/guardian/backend-startup.py --network-mode "$STARTUP_NETWORK_MODE" --output backend-startup.json
      - name: Clean only this run's disposable resources
        if: always()
        run: python .github/guardian/backend.py --cleanup-owned
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-startup-only
          path: backend-startup.json
          retention-days: 7
          if-no-files-found: warn
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.check != 'backend-startup'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - name: Require reviewed base verifier
        run: |
          for asset in verify-pr.py backend.py backend-config.toml install-backend-cli.py browser.config.ts; do
            test -f "trusted/.github/guardian/$asset" || { echo 'Bootstrap: the base branch does not yet contain the real-backend verifier. Review this setup PR and its exact-commit manual verification before merging.'; exit 1; }
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.check == 'visual-baseline' && 'main' || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install trusted HTTP client
        run: python -m pip install httpx==0.28.1
      - name: Build reviewed toolchain
        run: docker build --iidfile /tmp/sis-image-id trusted/.github/guardian
      - name: Install reviewed backend CLI
        run: python trusted/.github/guardian/install-backend-cli.py --directory "$RUNNER_TEMP/guardian-cli"
      - name: Test merge checkout without production credentials
        if: inputs.check != 'visual-baseline'
        run: python trusted/.github/guardian/verify-pr.py --repository candidate --image "$(cat /tmp/sis-image-id)" --output sis-pr-verification.json
      - name: Prepare Linux visual references from approved main
        if: inputs.check == 'visual-baseline'
        run: python trusted/.github/guardian/capture-visuals.py --repository candidate --image "$(cat /tmp/sis-image-id)" --output visual-baseline
      - name: Clean only this run's disposable backend resources
        if: always()
        run: |
          if [ -f trusted/.github/guardian/backend.py ]; then
            python trusted/.github/guardian/backend.py --cleanup-owned
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.check != 'visual-baseline'
        with:
          name: sis-pr-verification
          path: sis-pr-verification.json
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.check == 'visual-baseline'
        with:
          name: visual-baseline
          path: visual-baseline/
          retention-days: 7
          if-no-files-found: warn
