name: SIS isolated PR verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sis-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - name: Require reviewed base verifier
        run: |
          test -f trusted/.github/guardian/verify-pr.py || { echo 'Bootstrap: review and merge the CI setup before normal PR verification can run.'; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install trusted HTTP client
        run: python -m pip install httpx==0.28.1
      - name: Build reviewed toolchain
        run: docker build --iidfile /tmp/sis-image-id trusted/.github/guardian
      - name: Test merge checkout without production credentials
        run: python trusted/.github/guardian/verify-pr.py --repository candidate --image "$(cat /tmp/sis-image-id)" --output sis-pr-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sis-pr-verification
          path: sis-pr-verification.json
          retention-days: 30
          if-no-files-found: warn
