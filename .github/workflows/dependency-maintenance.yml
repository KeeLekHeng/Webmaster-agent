name: Verified SIS dependency maintenance

on:
  workflow_dispatch:
    inputs:
      preview_sis_sha:
        description: Optional full SIS commit SHA (read-only non-main previews only)
        required: false
        default: ''
        type: string
  schedule:
    - cron: '0 23 * * 0' # Monday 07:00 Malaysia; allow time before the Guardian digest.

permissions:
  contents: read

concurrency:
  group: sis-dependency-maintenance
  cancel-in-progress: false

jobs:
  verify:
    # Non-main runs are explicit read-only previews. Main retains its activation gate.
    if: (github.ref == 'refs/heads/main' && vars.GUARDIAN_MAINTENANCE_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      eligible: ${{ steps.result.outputs.eligible }}
      fingerprint: ${{ steps.result.outputs.fingerprint }}
      trusted_main: ${{ steps.mode.outputs.trusted_main }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Determine execution mode
        id: mode
        shell: python
        env:
          PREVIEW_SIS_SHA: ${{ inputs.preview_sis_sha }}
        run: |
          import os,re
          trusted_main=os.environ['GITHUB_REF']=='refs/heads/main'
          sha=os.getenv('PREVIEW_SIS_SHA','')
          if sha and (trusted_main or os.getenv('GITHUB_EVENT_NAME')!='workflow_dispatch' or not re.fullmatch(r'[a-f0-9]{40}',sha)):
              raise ValueError('SIS commit selection requires a read-only manual non-main preview and a full SHA')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('trusted_main='+str(trusted_main).lower()+'\n')
              output.write('sis_ref='+(sha or 'main')+'\n')
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KeeLekHeng/sisweb
          ref: ${{ steps.mode.outputs.sis_ref }}
          token: ${{ secrets.GUARDIAN_SIS_READ_TOKEN }}
          path: .sis-checkout
          persist-credentials: false
      - name: Install trusted controller
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Build isolated toolchain
        run: docker build --iidfile /tmp/guardian-image-id -f maintenance/Dockerfile maintenance
      - name: Install reviewed backend CLI
        run: python maintenance/install-backend-cli.py --directory "$RUNNER_TEMP/guardian-cli"
      - name: Install trusted repair parser
        if: steps.mode.outputs.trusted_main == 'true' && vars.GUARDIAN_COMPAT_REPAIRS_ENABLED == 'true'
        run: npm install --prefix "$RUNNER_TEMP/guardian-parser" --ignore-scripts --no-package-lock typescript@6.0.3
      - name: Verify baseline and candidate
        env:
          GUARDIAN_COMPAT_REPAIRS_ENABLED: ${{ steps.mode.outputs.trusted_main == 'true' && vars.GUARDIAN_COMPAT_REPAIRS_ENABLED || 'false' }}
          GUARDIAN_MAINTENANCE_MODEL: ${{ vars.GUARDIAN_MAINTENANCE_MODEL }}
          ANTHROPIC_API_KEY: ${{ steps.mode.outputs.trusted_main == 'true' && vars.GUARDIAN_COMPAT_REPAIRS_ENABLED == 'true' && secrets.GUARDIAN_MAINTENANCE_CLAUDE_KEY || '' }}
          GUARDIAN_TYPESCRIPT_PATH: ${{ runner.temp }}/guardian-parser/node_modules/typescript
        run: |
          python -m guardian.maintenance.runner --repository .sis-checkout --output maintenance-artifact --image "$(cat /tmp/guardian-image-id)"
      - name: Clean only this run's disposable backend resources
        if: always()
        run: python -m guardian.maintenance.backend --cleanup-owned
      - name: Bind verified result
        id: result
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          raw=pathlib.Path('maintenance-artifact/verification.json').read_bytes()
          report=json.loads(raw)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('eligible='+str(report['status']=='verified' and os.environ['GITHUB_REF']=='refs/heads/main').lower()+'\n')
              output.write('fingerprint='+hashlib.sha256(raw).hexdigest()+'\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-verification
          path: maintenance-artifact/
          retention-days: 30
          if-no-files-found: warn
  interpret:
    needs: verify
    if: always() && needs.verify.outputs.trusted_main == 'true' && needs.verify.result != 'skipped' && vars.GUARDIAN_DEPENDENCY_AI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-verification
          path: maintenance-artifact
      - name: Explain evidence without executing candidate code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.GUARDIAN_MAINTENANCE_CLAUDE_KEY }}
          GUARDIAN_MODEL: ${{ vars.GUARDIAN_MAINTENANCE_MODEL }}
        run: python -m guardian.cli dependency-review --input maintenance-artifact/verification.json --output dependency-reports --llm claude
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-review
          path: dependency-reports/
          retention-days: 30
          if-no-files-found: warn
  publish:
    needs: verify
    if: needs.verify.outputs.trusted_main == 'true' && needs.verify.outputs.eligible == 'true' && vars.GUARDIAN_DEPENDENCY_PRS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-verification
          path: maintenance-artifact
      - name: Install trusted replay parser
        run: npm install --prefix "$RUNNER_TEMP/guardian-parser" --ignore-scripts --no-package-lock typescript@6.0.3
      - name: Publish verified maintenance PR
        env:
          GUARDIAN_TYPESCRIPT_PATH: ${{ runner.temp }}/guardian-parser/node_modules/typescript
          GUARDIAN_SIS_WRITE_TOKEN: ${{ secrets.GUARDIAN_SIS_WRITE_TOKEN }}
          GUARDIAN_DEPENDENCY_PRS_ENABLED: ${{ vars.GUARDIAN_DEPENDENCY_PRS_ENABLED }}
          GUARDIAN_VERIFICATION_URL: https://github.com/KeeLekHeng/Webmaster-agent/actions/runs/${{ github.run_id }}
          EXPECTED_FINGERPRINT: ${{ needs.verify.outputs.fingerprint }}
        run: python -m guardian.maintenance.publisher --artifact maintenance-artifact --expected "$EXPECTED_FINGERPRINT"
